<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07090f" />
  <title>Mynah · Astrolabe Faces</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <script src="./face-data.js"></script>
</head>
<body class="faces-page">
  <main class="page">
    <a class="back" href="../">Mynah</a>
    <p class="eyebrow">Astrolabe face deck</p>
    <h1>Astrolabe satellite faces for Myndfulness @ Home.</h1>
    <p class="lede">
      These Astrolabe faces are bundled into the Mynah Capacitor app as an offline gallery for review, routing, and future cell-free satellite surfaces.
    </p>
    <div class="face-toolbar" aria-label="Face filters">
      <button data-filter="all" class="is-active">All</button>
      <button data-filter="pocket">Pocket</button>
      <button data-filter="lunasay">LunaSay</button>
      <button data-filter="ocarina">Ocarina</button>
      <button data-filter="luopan">Luopan</button>
      <button data-filter="core">Core</button>
    </div>
    <section id="faces" class="face-grid" aria-live="polite"></section>
  </main>
  <dialog id="face-dialog">
    <button class="dialog-close" data-close aria-label="Close">Close</button>
    <div id="face-detail"></div>
  </dialog>
  <script src="./faces.js"></script>
</body>
</html>
